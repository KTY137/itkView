[package]
name = "itkflow-desktop"
version = "0.2.2"
description = "itkView desktop shell"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/KTY137/itkView"
homepage = "https://github.com/KTY137/itkView"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
