name: Apply roadmap update

on:
  push:
    branches:
      - fix/complete-test-evidence-scope
    paths:
      - .github/workflows/apply-roadmap-update.yml

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-test-evidence-scope
          fetch-depth: 0
      - name: Record the evidence-completeness change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/04-roadmap.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Aktueller Stand (2026-08-28)\n\n"
          key = "itkView spiegelt Test-Evidence ueber die vollstaendige Assembly-Closure"
          bullet = """- **itkView spiegelt Test-Evidence ueber die vollstaendige Assembly-Closure
            (2026-08-29):** Der Komponenten-Sync folgte institutsfremden verbauten
            Teilen bisher nur einen Hop; der Evidence-Sweep filterte danach erneut nach
            Eigentum/Standort und einer statischen Typenliste. Dadurch konnten Sensor-,
            Hybrid-, PWB- und ASIC-Evidenzen trotz sichtbarem Komponentenbaum fehlen.
            Der read-only Sync verfolgt `children[]` jetzt rekursiv, lehnt abgeschnittene
            oder widerspruechliche Snapshots fail-closed ab und prueft anschliessend alle
            lebenden lokalen Roots plus ihre rekursiven Assembly-Nachfahren. Explizite
            Profil-Whitelists und der MODULE-only Lightweight-Modus bleiben bewusste
            Einschraenkungen. Nicht mehr gelieferte externe Nachfahren werden stale und
            vom alten Parent getrennt, damit ihre Evidenz nicht weiter am Modul erscheint.
            Keine Stage- oder PDB-Schreiblogik wurde geaendert. Vertrag:
            [`docs/14`](14-evidence-completeness.md)."""
          if key not in text:
              if marker not in text:
                  raise SystemExit("roadmap insertion marker not found")
              text = text.replace(marker, marker + bullet + "\n\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit the roadmap record
        run: |
          if git diff --quiet -- docs/04-roadmap.md; then
            exit 0
          fi
          git config user.name "KTY137"
          git config user.email "205057271+KTY137@users.noreply.github.com"
          git add docs/04-roadmap.md
          git commit -m "docs: record complete evidence mirror scope"
          git push origin HEAD:fix/complete-test-evidence-scope
