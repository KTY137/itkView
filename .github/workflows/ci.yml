name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "requests>=2.32"
      - name: Ruff lint changed backend files
        run: >-
          ruff check
          app/complete_component_sync.py
          app/complete_evidence_sync.py
          app/main.py
          app/sync.py
          tests/test_complete_component_sync.py
          tests/test_complete_evidence_sync.py
      - name: Ruff format changed backend files
        run: >-
          ruff format --check
          app/complete_component_sync.py
          app/complete_evidence_sync.py
          app/main.py
          app/sync.py
          tests/test_complete_component_sync.py
          tests/test_complete_evidence_sync.py
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --no-fund --no-audit
      - name: Build frontend
        run: npm run build

  desktop-contracts:
    name: Desktop packaging contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Windows and Linux packaging contracts
        run: python -m unittest discover -s desktop/tests -p "test_*.py"
