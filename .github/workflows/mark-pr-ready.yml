name: Mark evidence PR ready

on:
  push:
    branches:
      - fix/complete-test-evidence-scope
    paths:
      - .github/workflows/mark-pr-ready.yml

permissions:
  pull-requests: write
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark pull request ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 1 --repo "$GITHUB_REPOSITORY"
