# Dedicated itkView full stack. Copy .env.example to .env first.
# Production PDB reads are enabled by default (docs/09), but nothing contacts
# the PDB until a signed-in person connects personal access codes. itkView has
# no PDB-write capability. Set ITKFLOW_PDB_INSTANCE=offline in .env for a
# deployment that must reach no PDB at all.

name: itkview

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itkview
      POSTGRES_USER: itkview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - itkview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itkview -d itkview"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      # Scheduled-sync windows use this container-local wall clock. Set TZ in
      # deploy/.env to the institute's deployment timezone (docs/09).
      TZ: ${TZ:-Etc/UTC}
      ITKFLOW_PRODUCT_VARIANT: ${ITKFLOW_PRODUCT_VARIANT:-view}
      ITKFLOW_DATABASE_URL: postgresql+psycopg://itkview:${POSTGRES_PASSWORD}@postgres:5432/itkview
      ITKFLOW_ATTACHMENT_DIR: /data/attachments
      ITKFLOW_PDB_INSTANCE: ${ITKFLOW_PDB_INSTANCE:-production}
      ITKFLOW_ALLOW_PRODUCTION: ${ITKFLOW_ALLOW_PRODUCTION:-true}
      ITKFLOW_PDB_CREDENTIAL_ENCRYPTION_KEY: ${ITKFLOW_PDB_CREDENTIAL_ENCRYPTION_KEY:?set a stable encryption key in deploy/.env}
      ITKFLOW_PDB_WRITE_SCOPE: disabled
      ITKFLOW_ALLOW_PDB_WRITES: "false"
      ITKFLOW_OUTBOX_PROCESSOR: "off"
      ITKFLOW_REMINDER_SCHEDULER: "off"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - itkview_attachments:/data/attachments

  # Async outbox worker for itkFlow: the only process that writes reviewed
  # actions to the PDB. In itkView the container exits cleanly once and is not
  # restarted; the backend entry point independently enforces the same guard.
  worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        if [ "${ITKFLOW_PRODUCT_VARIANT:-view}" = "view" ]; then
          echo "itkView: outbox worker disabled (read-only product).";
          exit 0;
        fi;
        exec python -m app.run_worker
    environment:
      TZ: ${TZ:-Etc/UTC}
      # The worker receives the same product guard as the API. In the view
      # variant it must never turn a locally crafted action into a PDB write.
      ITKFLOW_PRODUCT_VARIANT: ${ITKFLOW_PRODUCT_VARIANT:-view}
      ITKFLOW_DATABASE_URL: postgresql+psycopg://itkview:${POSTGRES_PASSWORD}@postgres:5432/itkview
      ITKFLOW_ATTACHMENT_DIR: /data/attachments
      ITKFLOW_PDB_INSTANCE: ${ITKFLOW_PDB_INSTANCE:-production}
      ITKFLOW_ALLOW_PRODUCTION: ${ITKFLOW_ALLOW_PRODUCTION:-true}
      ITKFLOW_PDB_CREDENTIAL_ENCRYPTION_KEY: ${ITKFLOW_PDB_CREDENTIAL_ENCRYPTION_KEY:?set a stable encryption key in deploy/.env}
      ITKFLOW_PDB_WRITE_SCOPE: disabled
      ITKFLOW_ALLOW_PDB_WRITES: "false"
      ITKFLOW_OUTBOX_PROCESSOR: "off"
      ITKFLOW_WORKER_POLL_SECONDS: ${ITKFLOW_WORKER_POLL_SECONDS:-5}
      ITKFLOW_REMINDER_SCHEDULER: "off"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - itkview_attachments:/data/attachments

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        ITKFLOW_PRODUCT_VARIANT: ${ITKFLOW_PRODUCT_VARIANT:-view}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  itkview_pgdata:
  itkview_attachments:
